name: free-audit
on:
  issues:
    types: [opened, reopened]
permissions:
  issues: write
  contents: read
concurrency:
  group: free-audit
  cancel-in-progress: false
jobs:
  audit:
    if: contains(github.event.issue.title, '[audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.SERVICE_PAT }}
      ISSUE: ${{ github.event.issue.number }}
      AUTHOR: ${{ github.event.issue.user.login }}
      ASSOC: ${{ github.event.issue.author_association }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - name: Parse and validate request
        id: req
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          say() { GH_TOKEN=${{ github.token }} gh issue comment "$ISSUE" -R "${{ github.repository }}" -b "$1"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; }
          REPO=$(printf '%s\n%s' "$TITLE" "$BODY" | grep -oE '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' | grep -v '^OWNER/REPO$' | head -1)
          [ -n "$REPO" ] || say "Couldn't find an owner/name repo in the request."
          OWNER=${REPO%%/*}
          CONSENT=1
          if [ "$OWNER" != "$AUTHOR" ]; then
            # org repos: allow requests from PUBLIC members of the owning org
            if gh api "orgs/$OWNER/public_members/$AUTHOR" --silent 2>/dev/null; then
              : # verified org member — consent holds
            elif [ "$ASSOC" = "OWNER" ]; then
              # service-admin request for a repo they don't own: audit and report,
              # but PR creation on the target stays off (manual decision).
              CONSENT=0
            else
              say "This service audits repos you own, or org repos where you're a public member of \`$OWNER\` (you are \`$AUTHOR\`). Make your org membership public, or ask an org member to file the request."
            fi
          fi
          gh api "repos/$REPO" --jq .private | grep -q false || say "Public repos only."
          echo "consent=$CONSENT" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          TEST=$(printf '%s' "$BODY" | awk '/Test command/{f=1;next} f&&NF{print;exit}' | tr -d '\r')
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
      - name: Audit (probe mode, no agent, red never ships)
        if: steps.req.outputs.skip != '1'
        run: |
          set +e
          REPO="${{ steps.req.outputs.repo }}"
          NAME=${REPO##*/}
          git clone -q "https://github.com/$REPO.git" target
          cd target || exit 1
          git config user.name "bumpwright"
          git config user.email "bumpwright[bot]@users.noreply.github.com"
          if [ -f pnpm-lock.yaml ]; then corepack enable 2>/dev/null; pnpm install --frozen-lockfile || pnpm install
          elif [ -f yarn.lock ]; then yarn install --frozen-lockfile || yarn install
          elif [ -f package.json ]; then npm ci || npm install
          elif [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -d requirements ]; then
            python3 -m pip install --quiet pip-audit uv
          elif [ -f go.mod ]; then
            go mod download && go install golang.org/x/vuln/cmd/govulncheck@latest
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi
          T="${{ steps.req.outputs.test }}"
          if [ -n "$T" ]; then node ../bin/bumpwright.js audit --max-iters 0 --test "$T" > ../audit.log 2>&1
          else node ../bin/bumpwright.js audit --max-iters 0 > ../audit.log 2>&1
          fi
          [ -f package-lock.json ] && node ../bin/bumpwright.js fix >> ../audit.log 2>&1
          gh repo fork "$REPO" --clone=false 2>/dev/null; sleep 5
          FORK_OWNER=$(gh api user --jq .login)
          PRS=""
          for B in $(git branch --list 'bumpwright/*' --format='%(refname:short)'); do
            [ "$(git rev-list --count origin/HEAD..$B 2>/dev/null)" -gt 0 ] || continue
            git push -q "https://github.com/$FORK_OWNER/$NAME.git" "$B" || continue
            PRBODY=$(printf '%s\n\n%s\n\n%s' \
              "$(git log $B -1 --pretty=%b)" \
              "Opened by the free [bumpwright](https://github.com/nipunhsud/bumpwright) audit service at your request (nipunhsud/bumpwright#$ISSUE). Probe mode: version bumped, your own tests ran green, no AI code edits. Review like any PR." \
              "🤖 Generated with [Claude Code](https://claude.com/claude-code)")
            if [ "${{ steps.req.outputs.consent }}" = "1" ]; then
              URL=$(gh pr create --repo "$REPO" --head "$FORK_OWNER:$B" --title "$(git log $B -1 --pretty=%s)" --body "$PRBODY" 2>/dev/null)
              [ -n "$URL" ] && PRS=$(printf '%s\n- %s' "$PRS" "$URL")
            else
              PRS=$(printf '%s\n- `%s` pushed to the fork — admin request, no PR opened on `%s` (open manually if wanted)' "$PRS" "$B" "$REPO")
            fi
          done
          SUMMARY=$(grep -E "no vulnerabilities|fixable without|downgrade|transitive|already red|committed upgrade|committed npm audit fix|safely change|^bumpwright:" ../audit.log | sort -u | head -10 | sed 's/^/> /')
          [ -z "$SUMMARY" ] && SUMMARY="> no findings output — log tail: $(tail -2 ../audit.log | tr '\n' ' § ')"
          OUT=$(printf '**bumpwright free audit of `%s`**\n\n%s\n' "$REPO" "$SUMMARY")
          [ -n "$PRS" ] && OUT=$(printf '%s\n**Green upgrade PRs opened:**%s\n' "$OUT" "$PRS")
          OUT=$(printf '%s\nRed results need real migration work — run `bumpwright <pkg>` locally with an agent for those.' "$OUT")
          GH_TOKEN=${{ github.token }} gh issue comment "$ISSUE" -R "${{ github.repository }}" -b "$OUT"
